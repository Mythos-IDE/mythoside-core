[package]
name = "mythoside-rpc"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC server and stdio transport for MythosIDE core"

[dependencies]
mythoside-narrative = { path = "../narrative" }
mythoside-workspace = { path = "../workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
